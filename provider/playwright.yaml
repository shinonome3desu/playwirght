tools:
  - tools/playwright.yaml
extra:
  python:
    source: provider/playwright.py

credentials_for_provider:
  playwright_uri:
    label:
      en_US: Playwright URI
    help:
      en_US: e.g. ws://host.docker.internal:3003
    placeholder:
      en_US: Enter the Playwright URI
    required: true
    type: secret-input

  uri_type:
    label:
      en_US: URI Type
    help:
      en_US: Choose ws or cdp
    required: true
    type: select
    options:
      - value: ws
        label: { en_US: ws }
      - value: cdp
        label: { en_US: cdp }
    default: ws